[project]
name = "kb-builder"
version = "0.3.0"
description = "Sitemap-driven knowledge base builder with incremental sync and qmd indexing"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "html2text>=2024.2.26",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-docx>=1.1",
    "pymupdf>=1.25",
    "typer>=0.12",
]

[project.scripts]
kb = "kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
